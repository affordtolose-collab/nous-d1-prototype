    insufficient:`<p class="caution"><strong>證據不足，先蒐集更多證據。</strong>本次沒有「已測科目中的有效錯題」可以排優先章節；不會從未施測、證據不足或全部答對的科目推論弱點。</p>`}[P.status];
  let modeIntro={low_signal:`初步：${P.modes.strategies.length>1?'這些面向':'這個面向'}的探索訊號偏低（後驗 ≥ 50% 落在 &lt;−0.5），練習時以對應策略為主：`,no_low_signal:'沒有面向的探索訊號偏低，三種策略輪流使用：',no_evidence:'理解、推演、遷移都證據不足，先三種策略輪流使用，同時累積證據：'}[P.modes.basis];
  let modeLi=P.modes.strategies.map(s=>`<li><strong>${STRAT_TEXT[s][0]}</strong>：${STRAT_TEXT[s][1]}</li>`).join('');
  let focusText=f=>f.length?f.map(i=>escape(chapLabel(pr[i]))).join('、'):'';
  let task=d=>{let f=focusText(d.focus),st=d.strategy?`用「${STRAT_TEXT[d.strategy][0]}」`:'',rc=d.recall?'開頭 2 分鐘先不看筆記，回想前幾天寫下的重點（間隔回想）。':'';
    if(d.task==='initial')return `完成本次初始評估（已完成）。再用 ${d.minutes} 分鐘按「看答案與解析」${f?`，看 ${f} 的未答對題`:'，回看星港任務與學科題'}，寫下「我原本怎麼想、正解差在哪」。`;
    if(d.task==='practice')return `${rc}${f}：${st}複習這一章的核心概念，再做 3–5 題同章節的<strong>新題</strong>（課本或老師提供；本原型不提供題目）。每題作答前先標把握。`;
    if(d.task==='collect')return `${rc}補足證據：選一個已學過、但本次未施測或證據不足的科目，做 3–5 題新題，記下對錯與作答前把握；${st}練習。不從沒測到的科目推論弱點。`;
    return `${rc}回顧與持續：${f?`${f} 各做 1–2 題新題，`:''}記下本週實際完成幾天、哪天卡住。能持續比單次做很多更重要。`};
  let dayRows=P.days.map(d=>`<tr><td class="num">D${d.day}<br><span class="tag">${d.engine}</span></td><td class="num">${d.minutes}</td><td class="l">${task(d)}</td></tr>`).join('');
  let total=P.days.reduce((s,d)=>s+d.minutes,0),C=P.calibration,M=P.memory;
  return `<h2>三、學習方案推薦（初步）</h2>${studentView(state.nous)}<h3>方案細節與規則</h3><p class="caution">依下方<strong>公開規則</strong>，把本次的理解・推演・遷移訊號、信心校準、短延遲再認，以及各科的有效作答整理成一份起步方案。全部標示「初步」：題數很少、題目參數未經校準，<strong>不代表你的潛力上限，也不預測成績</strong>。請和老師或家人一起調整。</p>
  <h3>方案輸入</h3><div class="scroll"><table><tr><th>面向</th><th class="l">探索訊號</th><th>P(&gt;0.5) / P(&lt;−0.5)</th></tr>${coreRows}</table></div>
  <div class="scroll"><table><tr><th>科目</th><th class="l">本次證據</th><th>有效／未答對</th><th class="l">探索訊號</th><th class="l">探索潛力</th></tr>${subRows}</table></div>
  <p><small class="muted">信心校準：${C.n} 筆把握觀測；短延遲再認：${M.n} 筆有效、答對 ${M.correct} 題。${UNTESTED_CORE.join('、')}本版沒有施測，不列入。</small></p>
  <h3>初步：優先章節（2–3 個）</h3>${statusHtml}<p><small class="muted">${collectNote}${UNTESTED_CORE.join('、')}未施測，不推薦也不排除。</small></p>
  <h3>初步：學習模式</h3><p>${modeIntro}</p><ul>${modeLi}</ul><p><small class="muted">對應：理解（U）偏低→範例／圖解；推演（R）偏低→步驟拆解；遷移（T）偏低→多樣遷移。探索訊號只是策略提示，不是能力定論。</small></p>
  <h3>初步：信心校準——作答前先標把握</h3><p>每天練習時，每題<strong>作答前</strong>先寫下把握（用猜的／一半一半／大概會／很有把握），作答後對照。這是要養成的習慣，不是診斷。</p><p><small class="muted">本次 ${C.n} 筆把握觀測（本版最多 4 筆）。規則：至少 ${C.min_n} 筆且後驗 P(β&lt;−0.5) ≥ ${C.threshold} 才會提示「可能偏向過度自信」；${C.status==='possible_over'?`本次 P＝${fx(C.p_over)}，達到門檻，仍屬初步。`:'本次未達最少筆數，不判斷你是否過度自信。'}</small></p>
  <h3>初步：記憶與間隔回想</h3><p>短延遲再認${M.n?`有效 ${M.n} 筆、答對 ${M.correct} 題`:'沒有有效觀測'}。只有 2 題、延遲不受控，<strong>不推估長期記憶</strong>。方案用固定的間隔回想：D${M.review_days.join('、D')}。</p><p><small class="muted">這個間隔是固定的起步排程；未來可改由 FSRS 依你的回想紀錄個人化。<strong>目前沒有初始化 FSRS、沒有個人記憶參數，也不保證照做就能記住。</strong></small></p>
  <h3>7 日起步計畫（每天 10–15 分鐘，共 ${total} 分鐘）</h3><div class="scroll"><table><tr><th class="num">日</th><th class="num">分鐘</th><th class="l">任務</th></tr>${dayRows}</table></div>
  <p><small class="muted">EA＝初始評估（就是今天這份 D1）；EL＝學習任務；D7 回顧本週並記錄持續情形。沒做完不用補，隔天照排程繼續。</small></p>
  <h3>D30 進展檢核（EM）</h3><p>第 30 天用約 ${P.check.minutes} 分鐘做檢核：${pr.length?`${focusText(P.check.focus)} 的`:'已學科目的'}<strong>平行新題</strong>（同章節、同難度、但不是本次原題），加上星港規則的延遲回想；每題作答前先標把握。不重做原題，避免只是記住答案。</p><p><small class="muted">本原型目前沒有平行題庫，需由老師或下一版提供。D30 結果與 D1 比較時看方向，不看單次分數；仍屬初步。</small></p>
  <details><summary>規則全文（可自行檢查）</summary><ol>
  <li>探索訊號：後驗機率 ≥ ${RULES.explore_p} 落在 &gt;0.5 為「偏高」、落在 &lt;−0.5 為「偏低」，其餘「中間」；有效題 &lt; ${RULES.band_min_n}→「—」。上方顯示的標示仍用 70%／80% 門檻；探索訊號只用來選策略與排序。</li>
  <li>優先章節：只取「已測且有效題 ≥ ${RULES.band_min_n}」科目中<strong>有效作答（非快速作答、未切到背景）且未答對</strong>的題目，依其章節分組。排序：該科探索訊號偏低者優先 → 該科未答對題數多 → 該章節未答對題數多 → 固定科目順序 → 出題順序。最多取 ${RULES.plan_max} 個；少於 ${RULES.plan_min} 個時明說「證據不足，先蒐集更多證據」。未施測、證據不足的科目和全部答對的科目都不會被列入。</li>
  <li>探索潛力：只有理解與推演的探索訊號都偏高、且該科探索訊號偏低時，標「初步：可嘗試補強（探索）」，並需 D30 回測；其餘一律「未判定」。</li>
  <li>學習模式：理解偏低→範例／圖解；推演偏低→步驟拆解；遷移偏低→多樣遷移（多個偏低時依 P(&lt;−0.5) 由大到小輪流）；都不偏低或都證據不足→三種輪流。</li>
  <li>信心校準：一律建議「作答前先標把握」。只有把握觀測 ≥ ${RULES.calib_min_n} 筆且 P(β&lt;−0.5) ≥ ${RULES.calib_p} 才提示可能過度自信。</li>
  <li>記憶：只報告再認筆數與答對數；間隔回想固定在 D${RULES.review_days.join('、D')}，未接 FSRS。</li>
  <li>時間：D1–D7 依序 ${RULES.day_minutes.join('、')} 分鐘；D2–D6 依序輪流優先章節與學習模式；D30 約 ${RULES.check_minutes} 分鐘。</li></ol></details>`;
}
function reportAbout(body){return `<details class="report-about"><summary>關於這份報告</summary><p>這份報告根據本次少量作答整理，還不是經真人驗證的正式診斷，也不代表你的能力上限。沒測到的部分不做判斷；學習能力和學科表現分開看，不做排名。</p>${body||''}</details>`}
function histCard(r){const e=r.history_entry;if(!e)return '';return `<article class="summary-card"><h3>歷史：第一份素材從哪裡開始</h3><p><strong>${escape(e.tier_name)}・${escape(e.start_sublevel||'—')}</strong></p><p>先從這裡開始，做幾份素材後會再幫你微調。</p><small>希望難度剛好有挑戰，也讓你多數時候做得出來。</small></article>`}
function learningSection(r){return `<h2>學習能力｜找到適合你的做法</h2><p class="warm-note">${escape(strengthCopy(r))}</p><div class="summary-grid">${DIMS.map(d=>{const ev=state.events.filter(e=>e.dim===d&&!e.skipped_m),c=ev.filter(e=>e.correct).length;return `<article class="summary-card"><h3>${NAMES[d]}</h3><p>${ev.length?'這次答對 '+c+' / '+ev.length+' 題':'這次還沒有足夠作答'}</p><p>${({U:'讀完一段規則，用自己的話說一次重點。',R:'先列已知條件，一步寫一行。',T:'換個情境時，先找和原本相同的地方。'})[d]}</p></article>`}).join('')}</div>${reportAbout(technicalLearningSection(r))}`}
function subjectSection(r){return `<h2>學科表現｜從合適的地方開始</h2>${histCard(r)}<h3>其他科，看看這次做得如何</h3><div class="summary-grid">${r.subjects.filter(s=>s.enabled&&s.subject!=='歷史').map(s=>`<article class="summary-card"><h3>${escape(s.subject)}</h3><p>這次答對 ${s.correct} / ${s.valid} 題</p><p>${s.valid<2?'下次多做幾題，再一起找練習方向。':s.correct/s.valid>=.75?'這次答得不錯，把用到的方法留下來。':'先回看一題沒答對的，找出卡住的那一步。'}</p></article>`).join('')||'<p>這次沒有選答其他學科，下次可以從學過的章節試試。</p>'}</div>${reportAbout(technicalSubjectSection(r))}`}
function planSection(r){return `<h2>學習方案｜先練一點，慢慢累積</h2>${studentView(state.nous)}${reportAbout(technicalPlanSection(r).replace(studentView(state.nous),''))}`}
function overviewSection(r){return `<h2>你這次做得好的地方</h2><article class="summary-card strength-card"><h3>把這些做法帶到下一次</h3><p>${escape(strengthCopy(r))}</p></article><h3>接下來，先做這兩件事</h3><ol class="next-steps"><li><strong>從一小段練習開始。</strong><br>${r.plan.priorities.length?'先看「'+escape(chapLabel(r.plan.priorities[0]))+'」的一題解析，再自己試一題。':'選一個學過的章節，先看範例，再自己試一題。'}</li><li><strong>每天留 10–15 分鐘，先試一週。</strong><br>不用一次做很多，卡住的地方留著下次一起看。</li></ol>${histCard(r)}<p class="muted">想知道怎麼練，可以點「學習方案（給學生）」。</p>${reportAbout('<p>作答觀察只描述這次答案，不是常模或能力分級。完整的機率、證據強度和判斷依據保留在 NOUS 學習方案與各頁的說明中。</p>')}`}
function reportTabLayout(r){
 const names=['總覽','學習能力評估','學科能力評估','學習方案（給學生）','NOUS 學習方案'];
 const bodies=[overviewSection(r),learningSection(r),subjectSection(r),planSection(r),specPanel(state.nous,state.nousText)];
 return `<div class="report-tabs" role="tablist" aria-label="報告分類">${names.map((n,i)=>`<button role="tab" id="report-tab-${i}" aria-controls="report-panel-${i}" aria-selected="${i===0}" tabindex="${i===0?0:-1}">${n}</button>`).join('')}</div><p class="tab-hint">左右滑動頁籤，還有你的學習方案 →</p>${bodies.map((body,i)=>`<div role="tabpanel" id="report-panel-${i}" aria-labelledby="report-tab-${i}" tabindex="0" ${i?'hidden':''}>${body}</div>`).join('')}`;
}
function initReportTabs(){
 const tabs=Array.from(document.querySelectorAll('[role="tab"]'));
 function activate(tab,focus=false){tabs.forEach(t=>{const on=t===tab;t.setAttribute('aria-selected',String(on));t.tabIndex=on?0:-1;document.getElementById(t.getAttribute('aria-controls')).hidden=!on});if(focus)tab.focus();}
 tabs.forEach((tab,i)=>{tab.onclick=()=>activate(tab);tab.onkeydown=e=>{let j;if(e.key==='ArrowRight')j=(i+1)%tabs.length;if(e.key==='ArrowLeft')j=(i+tabs.length-1)%tabs.length;if(e.key==='Home')j=0;if(e.key==='End')j=tabs.length-1;if(j!==undefined){e.preventDefault();activate(tabs[j],true)}}});
 const copy=document.getElementById('copySpec');if(copy)copy.onclick=async()=>{const text=document.getElementById('nousSpecJson').textContent;try{await navigator.clipboard.writeText(text);document.getElementById('copyStatus').textContent='已複製 JSON'}catch(e){document.getElementById('copyStatus').textContent='無法自動複製，請選取下方 JSON 手動複製或下載。'}};
}

function completion(){
  report();
  const content=document.createElement('div');content.id='completedReport';
  while(app.firstChild)content.appendChild(app.firstChild);content.hidden=true;app.appendChild(content);
  const end=document.createElement('section');end.id='completionScreen';end.className='completion';end.innerHTML=`<div class="completion-mark" aria-hidden="true">✓</div><p class="flow">這次任務，完成了</p><h2>辛苦了！你已經找到下一步的線索。</h2><p>不管剛才有沒有卡住，這些作答都幫我們更了解你。</p><p>接下來看看做得好的地方，再帶走一個練習方向。</p><button class="primary" id="viewReport">看看我的學習報告</button>`;
  app.prepend(end);document.getElementById('viewReport').onclick=()=>{end.remove();content.hidden=false;window.scrollTo(0,0)};
}
function report(){
  let r=computeReport();state.report=r;state.nous=nousSpec(r,specContext());state.nousText=JSON.stringify(state.nous,null,2);
  app.innerHTML=`<section>${state.simulation?`<span id="simulationBanner" role="note">模擬數據 · 非真實學生</span>`:''}<p class="flow">你的學習報告 · v0.8</p><h2>找到起點，接著一起往前</h2>
  ${reportTabLayout(r)}
  <div class="row"><button id="review">看答案與解析</button><button id="download">下載匿名事件 JSON</button><button id="restart">重新開始</button></div><div id="answers"></div></section>`;
  initReportTabs();
  document.getElementById('review').onclick=()=>{document.getElementById('answers').innerHTML=state.events.map(e=>{let i=itemById(e.item_id);return `<p><strong>${escape(i.id)}</strong>${i.dim==='S'?` <small>（${escape(i.subject)}）</small>`:''} <span class="stem" style="font-size:16px;font-weight:400">${escape(i.stem)}</span><br>你選 ${'ABCD'[e.response]}；正解 ${'ABCD'[i.answer]}　${escape(i.options[i.answer])}：${escape(i.explain)}</p>`}).join('')};
  document.getElementById('restart').onclick=reset;
  document.getElementById('downloadSpec').onclick=()=>{let blob=new Blob([state.nousText],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`nous_learning_plan_${PAGE.mode}.json`;a.click();URL.revokeObjectURL(url)};
  document.getElementById('download').onclick=()=>{let blob=new Blob([JSON.stringify({model:'mac-3.0-compatible-subset',prototype:PAGE.version,page:PAGE.mode,rules:RULES,subject_source:PAGE.source_info,...state},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='nous-d1-anonymous.json';a.click();URL.revokeObjectURL(url)};
  debug();
}
function debug(){
  let counts=validCounts(),subRows=SUBJ_NAMES.map(s=>{let p=state.sub[s];if(!p)return `<tr><td>${escape(s)}</td><td colspan="4" class="l">未啟用</td></tr>`;let x=summary(p),n=state.events.filter(e=>e.dim==='S'&&e.subject===s&&!e.skipped_m).length;return `<tr><td>${escape(s)}</td><td>${fmt(x.mean)}</td><td>${fmt(x.sd)}</td><td>${n}</td><td class="l">${bandSubject(p,n).label}</td></tr>`}).join('');
  let srcTable=PRIVATE?`<div class="scroll"><table><tr><th class="l">科目</th><th class="l">題號</th><th>N</th><th>p</th><th>b</th><th class="l">GUID</th></tr>${SUBJECT_ITEMS.map(it=>`<tr><td>${escape(it.subject)}</td><td class="l">${escape(it.id)}</td><td>${it.source.n}</td><td>${it.source.p_correct.toFixed(4)}</td><td>${it.b.toFixed(4)}</td><td class="l">${escape(it.ref.guid)}</td></tr>`).join('')}</table></div>`:'';
  document.getElementById('debugContent').innerHTML=`<p>81 點／維、完整後驗；U/R/T 三個獨立 1D，加上每個學科各自獨立的 1D（共最多 8 個），不是聯合估計。SD 是不確定性，不是學生穩定度。</p>
  <div class="scroll"><table><tr><th>維度</th><th>平均</th><th>SD*</th><th>有效題</th><th class="l">標示</th></tr>${DIMS.map(d=>{let s=summary(state.m[d]);return `<tr><td>${d}</td><td>${fmt(s.mean)}</td><td>${fmt(s.sd)}</td><td>${counts[d]}</td><td class="l">${bandCore(state.m[d],counts[d]).label}</td></tr>`}).join('')}</table></div>
  <p><small>*後驗 SD，非頻率學派 SE。選題：每面向最多 4 題；先補有效題最少的面向，再選 Fisher 資訊×後驗變異最大者。停止：三面向都 SD ≤ 0.6 且各 ≥ 2 有效題，或 12 題用完。a_fast 使用實際經過時間 exp(QΔt)；P(無聊) ≥ .20 時 s 切換 .30。</small></p>
  <h3>學科（各自獨立，另計）</h3><p>${state.subjectPlan.enabled.length?`啟用：${escape(state.subjectPlan.enabled.join('、'))}。`:`未啟用：${escape(state.subjectPlan.reason||'尚未開始')}`}同 priorM/updateM；不進 U/R/T 選題與停止。</p><div class="scroll"><table><tr><th>科目</th><th>平均</th><th>SD</th><th>有效題</th><th class="l">標示</th></tr>${subRows}</table></div>${srcTable}
